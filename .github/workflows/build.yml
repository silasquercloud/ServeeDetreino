name: Compilar plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n menu.sh scripts/setup.sh scripts/install.sh scripts/start.sh scripts/welcome.sh scripts/java8.sh
      - run: python3 scripts/test-playit-agent.py
        timeout-minutes: 3
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: TreinoHub-1.0.0
          path: target/TreinoHub-1.0.0.jar
          if-no-files-found: error
