name: TreinoHub
version: 1.5.1
main: br.ryuex.treino.Treino
author: Ryuex
load: POSTWORLD
description: Salas privadas de treino BedWars, BedFight e SkyWars.
commands:
  treino:
    description: Abre o menu de modos e salas.
    aliases: [jogar, sala, hubtreino]
    usage: /treino
  party:
    description: Party com convites clicáveis e entrada em grupo nas salas.
    aliases: [p]
    usage: /party
  ranking:
    description: Classificação local de vitórias, abates e camas.
    aliases: [top]
    usage: /ranking [bedwars|bedfight|skywars]

  importarcomprarapida:
    description: Copia favoritos de outro perfil local.
    usage: /importarcomprarapida <nick>
  treinoadmin:
    description: Painel de testes do administrador.
    permission: treino.admin
    aliases: [tadmin]
  cps:
    description: Contador de ações por segundo recebido pelo servidor.
    permission: treino.admin
  fastplace:
    description: Pista de construção assistida para testes.
    permission: treino.admin
  bridge:
    description: Treino de ponte manual com cronômetro.
    permission: treino.admin

permissions:
  treino.admin:
    default: op
