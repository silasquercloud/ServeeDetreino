name: TreinoHub
version: 1.2.0
main: br.ryuex.treino.Treino
author: Ryuex
load: POSTWORLD
description: Salas privadas de treino BedWars, BedFight e SkyWars.
commands:
  treino:
    description: Abre o menu de modos e salas.
    aliases: [jogar, sala, hubtreino]
    usage: /treino
  party:
    description: Party com convites clicáveis e entrada em grupo nas salas.
    aliases: [p]
    usage: /party
  ranking:
    description: Classificação local de vitórias, abates e camas.
    aliases: [top]
    usage: /ranking [bedwars|bedfight|skywars]

permissions:
  treino.admin:
    default: op
